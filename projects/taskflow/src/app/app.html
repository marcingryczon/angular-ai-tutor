<header class="topbar">
  <a class="topbar__brand" [routerLink]="['/']" aria-label="TaskFlow home">
    <span class="topbar__logo" aria-hidden="true"><span class="material-symbols-rounded material-symbols-rounded--filled">view_kanban</span></span>
    <span class="topbar__name">TaskFlow</span>
  </a>

  <div class="topbar__actions">
    <label class="topbar__role">
      <span class="topbar__role-label">Role</span>
      <select
        class="field__input topbar__role-select"
        [ngModel]="session.role()"
        (ngModelChange)="session.setRole($event)"
        aria-label="Switch role"
      >
        <option value="admin">Admin</option>
        <option value="member">Member</option>
      </select>
    </label>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>
