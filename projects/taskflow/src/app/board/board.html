<header class="board__header">
  <div class="board__heading">
    <a class="board__back" href="/">
      <span class="material-symbols-rounded material-symbols-rounded--sm">arrow_back</span>
      All boards
    </a>
    <h1 class="board__title">
      Marketing Sprint
      <span class="visibility-badge visibility-team">Team</span>
    </h1>
    <p class="board__desc">Plan and track marketing work for the current sprint.</p>
  </div>
</header>

<div class="board__columns">
  <section class="column">
    <header class="column__header">
      <h2 class="column__title">To Do</h2>
      <span class="column__count">{{countFor('todo')}}</span>
    </header>
    <div class="column__cards">
      <p class="column__empty">No tasks</p>
    </div>
  </section>

    <section class="column">
    <header class="column__header">
      <h2 class="column__title">In Progress</h2>
      <span class="column__count">{{countFor('in-progress')}}</span>
    </header>
    <div class="column__cards">
      <p class="column__empty">No tasks</p>
    </div>
  </section>

    <section class="column">
    <header class="column__header">
      <h2 class="column__title">Review</h2>
      <span class="column__count">{{countFor('review')}}</span>
    </header>
    <div class="column__cards">
      <p class="column__empty">No tasks</p>
    </div>
  </section>

    <section class="column">
    <header class="column__header">
      <h2 class="column__title">Done</h2>
      <span class="column__count">{{countFor('done')}}</span>
    </header>
    <div class="column__cards">
      <p class="column__empty">No tasks</p>
    </div>
  </section>
</div>
