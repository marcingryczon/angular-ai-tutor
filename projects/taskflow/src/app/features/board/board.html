<section class="board">
  <header class="board__header">
    <div class="board__heading">
      <a class="board__back" href="/">
        <span class="material-symbols-rounded material-symbols-rounded--sm">arrow_back</span>
        All boards
      </a>
      <h1 class="board__title">
        {{ boardTitle }}
        <span class="visibility-team">team</span>
      </h1>
      <p class="board__desc">{{ description }}</p>
      <p class="board__meta">{{ tasks.length }} task(s)</p>
    </div>

    <div class="board__actions">
      <button type="button" class="btn btn--primary" (click)="isCreating = true">
        <span class="material-symbols-rounded material-symbols-rounded--sm">add</span>
        New task
      </button>
    </div>
  </header>

  <div class="board__columns">
    @for (column of columns; track column.id) {
      <app-column
        [column]="column"
        [tasks]="tasksOf(column)"
        [users]="users"
        (quickAdd)="onQuickAdd(column, $event)"
        (editTask)="onEdit($event)"
        (removeTask)="onRemove($event)"
        (taskMoved)="onMove($event)"
      />
    }
  </div>
</section>

@if (isCreating || editedTask) {
  <app-modal [title]="editedTask ? 'Edit task' : 'New task'" (closed)="closeModal()">
    <p class="board__modal-placeholder">The task form arrives in Phase 6 (Signal Forms).</p>
  </app-modal>
}
