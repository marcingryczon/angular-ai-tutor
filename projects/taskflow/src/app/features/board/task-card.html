<article class="task-card">
  <header class="task-card__header">
    <span class="badge" [class]="'badge badge--' + task.priority">{{ task.priority }}</span>
    <div class="task-card__actions">
      <button type="button" class="icon-btn" title="Edit task">
        <span class="material-symbols-rounded material-symbols-rounded--sm">edit</span>
      </button>
      <button type="button" class="icon-btn icon-btn--danger" title="Delete task">
        <span class="material-symbols-rounded material-symbols-rounded--sm">delete</span>
      </button>
    </div>
  </header>

  <h3 class="task-card__title">{{ task.title }}</h3>
  @if (task.description) {
    <p class="task-card__desc">{{ task.description }}</p>
  }

  <footer class="task-card__footer">
    <span class="task-card__due">
      <span class="task-card__dot"></span>
      {{ task.dueDate || 'no due date' }}
    </span>
    @if (task.assigneeId) {
      <span class="task-card__avatar" [title]="assigneeName">{{ assigneeName.charAt(0) }}</span>
    }
  </footer>
</article>
