<div class="modal__backdrop" (click)="onBackdropClick($event)">
  <div class="modal__panel" role="dialog" aria-modal="true" [attr.aria-label]="title()">
    <header class="modal__header">
      <h2 class="modal__title">{{ title() }}</h2>
      <button type="button" class="icon-btn" aria-label="Close dialog" (click)="closed.emit()">
        <span class="material-symbols-rounded material-symbols-rounded--sm">close</span>
      </button>
    </header>
    <div class="modal__body">
      <ng-content />
    </div>
  </div>
</div>
